<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Workspace & File Manager</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="app-container" id="appContainer">
    <header class="app-header" id="appHeader">
        <h1>Workspace Explorer</h1>
    </header>

    <!-- Configuration Bar -->
    <details class="config-panel" id="configPanel">
        <summary>⚙️ App Settings</summary>
        <div class="config-grid">
            <div class="input-group">
                <label for="tokenInput">GitHub Token (PAT):</label>
                <input type="password" id="tokenInput" placeholder="ghp_...">
                <button id="connectGhBtn" class="btn btn-sm btn-secondary" type="button" style="margin-top: 5px;">Fetch Repositories</button>
            </div>
            <div class="input-group">
                <label for="repoSelect">Repository:</label>
                <select id="repoSelect" class="config-select">
                    <option value="">-- Enter PAT to load repos --</option>
                </select>
            </div>
            <div class="input-group">
                <label for="branchSelect">Branch:</label>
                <select id="branchSelect" class="config-select">
                    <option value="">-- Select a repo first --</option>
                </select>
            </div>
        </div>
    </details>

    <!-- Action Toolbar -->
    <div class="toolbar" id="appToolbar">
        <button id="newFileBtn" class="btn" type="button">📄 New File</button>
        <label for="uploadInput" class="btn btn-secondary">📦 Import / ZIP</label>
        <input type="file" id="uploadInput" multiple accept="*/*" style="display: none;">
        <button id="pushAllGitHubBtn" class="btn btn-warning" type="button">🚀 Push All</button>
    </div>

    <!-- Windows File Manager Section -->
    <section class="file-manager-section" id="explorerSection">
        <div class="fm-header">
            <span>📁 Explorer</span>
            <span id="itemCount">0 items</span>
        </div>
        <div id="fileTree" class="file-tree"></div>
    </section>

    <!-- Code Editor Section -->
    <section class="editor-section" id="editorSection">
        <div class="editor-header">
            <span id="activeFileLabel">No file selected</span>
            <div class="editor-actions">
                <button id="searchToggleBtn" class="btn btn-sm btn-secondary" type="button">🔍 Find</button>
                <button id="fullscreenBtn" class="btn btn-sm btn-secondary" type="button">⛶ Fullscreen</button>
                <button id="saveLocalBtn" class="btn btn-sm" type="button">💾 Save</button>
                <button id="pushGitHubBtn" class="btn btn-sm btn-success" type="button">☁️ Push</button>
                <button id="closeFileBtn" class="btn btn-sm btn-danger" type="button">✕ Close</button>
            </div>
        </div>

        <!-- Code Region / Block Navigation Bar -->
        <div id="blockNav" class="block-navigation-bar">
            <span class="no-blocks">No defined #region blocks</span>
        </div>

        <!-- Search & Replace Bar -->
        <div id="searchReplaceBar" class="search-bar hidden">
            <input type="text" id="searchInput" placeholder="Find text...">
            <input type="text" id="replaceInput" placeholder="Replace with...">
            <button id="findNextBtn" class="btn btn-sm btn-secondary" type="button">Find Next</button>
            <button id="replaceBtn" class="btn btn-sm" type="button">Replace</button>
            <button id="replaceAllBtn" class="btn btn-sm btn-secondary" type="button">Replace All</button>
        </div>

        <!-- Line Numbers + Dual-Layer Editor Workspace -->
        <div class="editor-workspace editor-container">
            <div id="lineNumbers" class="line-numbers">1</div>
            <div class="editor-wrapper">
                <div id="highlightLayer" class="highlight-layer"></div>
                <textarea id="editor" class="editor-textarea" placeholder="Select a file from the explorer to edit..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
            </div>
        </div>
    </section>
</div>

<script src="app.js"></script>
</body>
</html>
