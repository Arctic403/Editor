<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>Mobile Workspace Editor</title>
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="app-container" id="appContainer">
  <header class="app-header" id="appHeader">
    <button class="icon-btn mobile-only" id="openDrawerBtn" aria-label="Open files">☰</button>
    <h1>Mobile Workspace</h1>
    <div class="header-controls">
      <select id="themeSelect" class="config-select"><option value="dark">Dark</option><option value="light">Light</option><option value="monokai">Monokai</option></select>
      <button class="btn" id="fullscreenBtn">⛶</button>
    </div>
  </header>

  <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div class="drawer-header"><strong>Files</strong><button class="icon-btn" id="closeDrawerBtn">✕</button></div>
    <div class="drawer-actions"><button class="btn" id="newFileBtn">＋ File</button><button class="btn" id="newFolderBtn">＋ Folder</button></div>
    <div class="file-tree" id="fileTree"></div>
  </aside>
  <div class="drawer-scrim hidden" id="drawerScrim"></div>

  <main class="page-view active" id="explorerView">
    <details class="config-panel" id="configPanel">
      <summary>⚙️ GitHub Settings</summary>
      <div class="config-grid">
        <div class="input-group"><label>Personal Access Token</label><input type="password" id="tokenInput" autocomplete="off" placeholder="GitHub token"></div>
        <button class="btn" id="connectGhBtn">Connect GitHub</button>
        <div class="input-group"><label>Repository</label><input id="repoInput" placeholder="owner/repository"></div>
        <div class="input-group"><label>Branch</label><input id="branchInput" value="main"></div>
        <button class="btn" id="pullGitHubBtn">↓ Pull</button>
        <button class="btn btn-success" id="pushAllGitHubBtn">↑ Commit & Push</button>
      </div>
    </details>

    <div class="toolbar" id="appToolbar">
      <label class="btn">📥 Import<input type="file" id="uploadInput" webkitdirectory directory multiple hidden></label>
      <label class="btn">📦 ZIP<input type="file" id="zipInput" accept=".zip" hidden></label>
      <button class="btn" id="downloadFileBtn">⇩ File</button>
      <button class="btn btn-warning" id="exportWorkspaceBtn">📦 Download ZIP</button>
      <button class="btn" id="searchWorkspaceBtn">🔎 Search</button>
    </div>

    <section class="file-manager-section">
      <div class="fm-header"><span>Workspace Directory</span><span id="itemCount">0 files</span></div>
      <div class="file-tree desktop-tree" id="desktopFileTree"></div>
    </section>
  </main>

  <main class="page-view" id="editorView">
    <section class="editor-section" id="editorSection">
      <div class="editor-header">
        <div class="active-file-info"><span id="saveIndicator" class="save-indicator clean">○</span><span id="activeFileLabel">No file selected</span></div>
        <div class="editor-actions">
          <button class="btn btn-sm" id="undoBtn">↶</button><button class="btn btn-sm" id="redoBtn">↷</button>
          <button class="btn btn-sm" id="quickOpenBtn">🔍</button><button class="btn btn-sm" id="jumpLineBtn">↕</button>
          <button class="btn btn-sm" id="searchToggleBtn">Find</button><button class="btn btn-sm btn-success" id="saveLocalBtn">💾</button>
          <button class="btn btn-sm" id="closeFileBtn">✕</button>
        </div>
      </div>
      <div class="tabs-bar" id="tabsBar"></div>
      <div class="breadcrumb-bar" id="breadcrumbBar">Workspace</div>
      <div class="search-bar hidden" id="searchReplaceBar">
        <input id="searchInput" placeholder="Find text..."><input id="replaceInput" placeholder="Replace with...">
        <button class="btn btn-sm" id="findNextBtn">Next</button><button class="btn btn-sm" id="replaceBtn">Replace</button><button class="btn btn-sm" id="replaceAllBtn">All</button>
      </div>
      <div class="workspace-panes">
        <div class="editor-workspace">
          <div class="line-numbers" id="lineNumbers">1</div>
          <div class="editor-wrapper" id="editorWrapper">
            <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"><code id="highlightCode"></code></pre>
            <textarea id="editor" class="editor-textarea" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Select or create a file..."></textarea>
          </div>
        </div>
      </div>
      <div class="accessory-keyboard-bar" id="symbolBar"></div>
    </section>
  </main>

  <nav class="mobile-bottom-bar">
    <button id="mobileFilesBtn">📁<span>Files</span></button><button id="mobileSearchBtn">🔎<span>Search</span></button>
    <button id="mobileSaveBtn">💾<span>Save</span></button><button id="mobileGitBtn">☁️<span>Git</span></button><button id="mobileMoreBtn">•••<span>More</span></button>
  </nav>
</div>

<div class="modal-overlay hidden" id="quickOpenModal"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle">Quick Open</h3><button class="modal-close" id="closeQuickOpenModal">✕</button></div><input id="quickOpenInput" placeholder="Type a file name or path..."><div class="quick-open-results" id="quickOpenResults"></div></div></div>
<script src="app.js"></script>
</body>
</html>
