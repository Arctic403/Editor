<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Workspace + GitHub Push</title>
    <link rel="stylesheet" href="style.css">

    <!-- iOS Compatible JSZip CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Local Workspace</h1>

    <div class="config-grid">
        <div class="input-group">
            <label for="tokenInput">GitHub Token (PAT):</label>
            <input type="password" id="tokenInput" placeholder="ghp_...">
        </div>

        <div class="input-group">
            <label for="repoInput">Repo (owner/repo):</label>
            <input type="text" id="repoInput" placeholder="username/repository">
        </div>

        <div class="input-group">
            <label for="branchInput">Branch:</label>
            <input type="text" id="branchInput" value="main">
        </div>
    </div>

    <hr>

    <h2>Your Local Files</h2>

    <div id="fileControls">
        <button id="newFileBtn" class="btn">New File</button>
        <label for="uploadInput" class="btn btn-secondary">Upload Files / ZIP</label>
        <input type="file" id="uploadInput" multiple accept=".zip,*/*" style="display: none;">
    </div>

    <ul id="fileList"></ul>

    <hr>

    <h2>Editor</h2>
    <div id="activeFileLabel">No file selected</div>
    <textarea id="editor" placeholder="Select or create a file to start editing..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

    <div id="editorControls">
        <button id="saveLocalBtn" class="btn">Save Locally</button>
        <button id="pushGitHubBtn" class="btn btn-success">Push Current File</button>
        <button id="pushAllGitHubBtn" class="btn btn-warning">Push All Workspace Files</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
