name: Ironvale Local Play Cache Migration

on:
  push:
    branches: [main]
    paths:
      - '.editor-maintenance/ironvale-local-play-v3'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Local Play native/cache boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path

          single = Path('single-player.js')
          text = single.read_text()
          replacements = {
              "ironvale-local-native-build-v2": "ironvale-local-native-build-v3",
              "riftcore-local-v2": "riftcore-local-v3",
              "ironvale-native-compiler-worker.js?v=2": "ironvale-native-compiler-worker.js?v=3-ios-network",
              "ironvale-local-play-sw.js?v=1": "ironvale-local-play-sw.js?v=2",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected Local Play token: {old}')
              text = text.replace(old, new)
          single.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          old = 'single-player.js?v=1-static-persistent'
          new = 'single-player.js?v=3-ios-native-network'
          if old not in html:
              raise SystemExit(f'Missing expected index token: {old}')
          index.write_text(html.replace(old, new))
          PY

          rm -f .editor-maintenance/ironvale-local-play-v3
          rmdir .editor-maintenance 2>/dev/null || true
          rm -f .github/workflows/ironvale-local-play-sync.yml

      - name: Verify JavaScript syntax
        run: |
          node --check single-player.js
          node --check ironvale-native-compiler-worker.js
          node --check ironvale-local-play-sw.js

      - name: Commit Local Play v3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Ironvale Local Play compiler reliable on iOS"
          git push origin HEAD:main
